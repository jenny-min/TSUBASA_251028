<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <h2>Quản lý sinh viên</h2>
      <div class="input-group">
        <input id="name" type="text" placeholder="Tên sinh viên" />
        <input id="age" type="number" placeholder="Tuổi" />
        <input id="className" type="text" placeholder="Lớp" />
        <button onclick="handleCreateStudent">Thêm</button>
      </div>

      <!-- Phạm vi input search -->
      <div class="search">
        <input
          type="text"
          placeholder="Tìm kiếm sinh viên"
          oninput="handleSearchStudent(event)"
        />
      </div>

      <!-- Phạm vi danh sách sinh viên -->
      <table border="1">
        <thead>
          <tr>
            <th>Tên</th>
            <th>Tuổi</th>
            <th>Lớp</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody id="studentList">
          <tr>
            <td>Nguyễn Văn A</td>
            <td>21</td>
            <td>C001</td>
            <td>
              <button>Sửa</button>
              <button>Xóa</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Script -->
    <script src="./manager_student.js"></script>
  </body>
</html>
