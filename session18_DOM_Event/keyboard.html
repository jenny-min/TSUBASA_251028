<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .container {
        width: 60%;
        margin: 0 auto;
        text-align: center;
      }
      textarea {
        width: 100%;
        padding: 10px;
        font-size: 18px;
        margin-bottom: 18px;
        border-radius: 6px;
        border: 1px solid #ccc;
        resize: none;
      }
      .keyboard {
        display: grid;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <textarea id="textInput" rows="5" cols="50"></textarea>

      <div class="keyboard">
        <button onclick="addText('A')" class="key">A</button>
        <button onclick="addText('B')" class="key">B</button>
        <button onclick="addText('c')" class="key">C</button>
        <button onclick="addText('D')" class="key">D</button>
        <button onclick="addText('E')" class="key">E</button>
        <button onclick="addText('F')" class="key">F</button>
        <button onclick="addText('G')" class="key">G</button>
        <button onclick="addText('H')" class="key">H</button>
        <button onclick="addText('I')" class="key">I</button>
        <button onclick="addText('K')" class="key">K</button>
        <button onclick="addText('L')" class="key">L</button>
        <button onclick="addText('M')" class="key">M</button>
        <button onclick="addText('N')" class="key">N</button>
        <button onclick="addText('O')" class="key">O</button>
        <button onclick="addText('P')" class="key">P</button>
        <button onclick="addText('Q')" class="key">Q</button>
        <button onclick="addText('R')" class="key">R</button>
        <button onclick="addText('S')" class="key">S</button>
        <button onclick="addText('T')" class="key">T</button>
        <button onclick="addText('U')" class="key">U</button>
        <button onclick="addText('X')" class="key">X</button>
        <button onclick="addText('Y')" class="key">Y</button>
        <button onclick="addText('Z')" class="key">Z</button>
        <button onclick="addText('')" class="key">Xóa</button>
      </div>
    </div>

    <script>
      function addText(text) {
        //Lấy ra phần tử của textarea
        const textArea = document.getElementById("textInput");

        // Gán lại giá trị cho textarea
        textArea.value += text;
      }

      function deleteText() {
        // Lấy ra phần tử của Textarea
        const textArea = document.getElementById("textInput");

        //Xóa phần
        textArea.value = textArea.value.slice(0, -1);
      }
    </script>
  </body>
</html>
