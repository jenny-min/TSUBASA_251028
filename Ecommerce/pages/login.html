<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang đăng nhập</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="container">
      <form id="formLoging" class="form col-md-6">
        <header class="form-header">
          <h2 class="form-title">Đăng nhập</h2>
          <div class="description">
            <p class="description hidden-mobile">
              Đăng nhập tài khoản để sử dụng hệ thống quản lý.
            </p>
            <p class="description show-mobile hidden">
              Đăng nhập tài khoản để sử dụng dịch vụ
            </p>
          </div>
        </header>
        <main class="form-body">
          <div class="col-auto">
            <label for="formGroupExampleInput" class="form-label">Email</label>
            <input
              type="text"
              class="form-control"
              id="email"
              placeholder="Email"
            />
          </div>
          <div class="col-auto">
            <label for="formGroupExampleInput2" class="form-label"
              >Password</label
            >
            <input
              type="text"
              class="form-control"
              id="password"
              placeholder="Password"
            />
          </div>
          <div class="col-12 form-function">
            <div class="form-check hidden-mobile">
              <input class="form-check-input" type="checkbox" id="gridCheck" />
              <label class="form-check-label" for="gridCheck">
                Nhớ tài khoản
              </label>
            </div>
            <div class="hidden-mobile">
              <a href="">Quên mật khẩu?</a>
            </div>
            <div class="show-mobile hidden">
              <input class="input-checkbox" type="checkbox" />
              <span
                >Bạn đồng ý với <a href="">chính sách và điều khoản</a></span
              >
            </div>
          </div>
        </main>
        <footer class="form-footer">
          <div class="col-12">
            <button type="submit" class="btn btn-primary btn-form">
              Đăng nhập
            </button>
          </div>
          <p class="form-redirect hidden-mobile">
            <span
              >Bạn chưa có tài khoản?
              <a href="./register.html">Đăng ký</a></span
            >
          </p>
        </footer>
      </form>
    </div>
    <script src="../js/login.js"></script>
  </body>
</html>
