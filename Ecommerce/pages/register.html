<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang đăng ký</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/register.css" />
  </head>
  <body>
    <div class="container">
      <form id="formRegister" class="row">
        <header class="form-header">
          <h2 class="form-title">Đăng ký</h2>
          <div class="description">
            <p class="description">Đăng ký tài khoản để sử dụng dịch vụ</p>
          </div>
        </header>
        <main class="form-body">
          <div class="form-group">
            <div class="col-md-6">
              <label for="userFamilyName" class="form-label"
                >Họ và tên đệm</label
              >
              <input
                type="text"
                class="form-control"
                id="userFamilyName"
                name="userFamilyName"
              />
              <p class="text-error" id="userFamilyNameError"></p>
            </div>
            <div class="col-md-6">
              <label for="userName" class="form-label">Tên</label>
              <input
                type="text"
                class="form-control"
                id="userName"
                name="userName"
              />
              <p class="text-error" id="userNameError"></p>
            </div>
          </div>

          <div class="col-auto">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="you@company.com"
              name="email"
            />
            <p class="text-error" id="emailError"></p>
          </div>
          <div class="col-auto">
            <label for="password" class="form-label">Mật khẩu</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="password"
              name="password"
            />
            <p class="text-error" id="passwordError"></p>
          </div>
          <div class="col-auto">
            <label for="rePassword" class="form-label">Xác nhận mật khẩu</label>
            <input
              type="password"
              class="form-control"
              id="rePassword"
              placeholder="re-password"
              name="rePassword"
            />
            <p class="text-error" id="rePasswordError"></p>
          </div>
          <div class="form-function">
            <input class="input-checkbox" type="checkbox" id="agree" />
            <span>Bạn đồng ý với <a href="">chính sách và điều khoản</a></span>
          </div>
          <p id="message"></p>
        </main>
        <footer class="form-footer">
          <div class="col-12">
            <button type="submit" class="btn btn-primary btn-form">
              Đăng ký
            </button>
          </div>
          <p class="form-redirect">
            <span
              >Bạn đã có tài khoản?
              <a href="../pages/login.html">Đăng nhập</a></span
            >
          </p>
        </footer>
      </form>
    </div>
    <!-- Script -->
    <script src="../js/register.js"></script>
  </body>
</html>
