<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang thống kê</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="main-container">
      <!-- Phần sidebar -->
      <aside id="menu-component" class="aside"></aside>

      <section class="section-container">
        <header class="section-header">
          <div id="header-component" class="header-nav"></div>
          <div class="main">
            <div class="header-toolbar">
              <div class="header-title">
                <h1 class="title">Thống kê</h1>
                <button onclick="handleShowModal()" class="btn-add">
                  Log out
                </button>
              </div>
            </div>
          </div>
        </header>
      </section>
    </div>
    <!-- Script -->
    <script src="../js/auth.js"></script>
    <script src="../js/aside.js"></script>
    <script src="../js/header.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Gán phần chuỗi HTML vào component -->
    <script>
      document.querySelector("#menu-component").innerHTML =
        renderAside("dashboard");
      document.querySelector("#header-component").innerHTML =
        renderHeader("dashboard");
    </script>
  </body>
</html>
