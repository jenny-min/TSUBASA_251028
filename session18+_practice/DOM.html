<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .error {
        color: red;
        display: none;
      }
    </style>
  </head>
  <body>
    <h1 id="heading-1">DOM trong JS</h1>

    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>

    <button onclick="handleClick()">Click me</button>
    <button id="btn-add">Thêm</button>
    <button id="btn-edit">Cập nhật</button>

    <input type="text" oninput="handleChange(event)" />
    <!-- Form đăng nhập tài khoản -->
    <form onsubmit="handleSubmit(event)">
      <h3>Đăng nhập tài khoản</h3>
      <div>
        <label for="">Email</label>
        <input type="text" id="email-input" />
      </div>
      <p id="email-error" class="error">Email không được để trống</p>
      <div>
        <label for="">Mật khẩu</label>
        <input type="password" id="password-input" />
      </div>
      <p id="password-error" class="error">Mật khẩu không được để trống</p>
      <br />
      <button type="button">Hủy</button>
      <button type="submit">Đăng nhập</button>
    </form>

    <script src="./DOM.js"></script>
  </body>
</html>
