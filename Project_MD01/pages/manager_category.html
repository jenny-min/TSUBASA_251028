<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang danh mục</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="main-container">
      <!-- Phần sidebar -->
      <aside id="menu-component" class="aside"></aside>
      <!-- Phần section caegory -->
      <main class="section-container">
        <!-- Section header -->
        <header class="section-header">
          <div id="header-component" class="header-nav"></div>
          <div class="main">
            <div class="header-toolbar">
              <div class="header-title">
                <h1 class="title">Danh mục</h1>
                <button onclick="handleShowModal()" class="btn-add">
                  Thêm mới danh mục
                </button>
              </div>
              <div class="header-interaction">
                <div class="status-bar">
                  <select class="status-select" name="" id="">
                    <option value="">Tất cả</option>
                    <option value="" selected>Đang hoạt động</option>
                    <option value="">Ngừng hoạt động</option>
                  </select>
                </div>
                <div class="search-bar">
                  <input
                    id="searchInput"
                    type="text"
                    placeholder="Tìm kiếm danh mục theo tên"
                  />
                  <button><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
              </div>
            </div>
            <!-- Phần danh mục sản phẩm -->
            <section class="section-main">
              <div class="table-list">
                <table class="table">
                  <thead class="thead">
                    <tr>
                      <th>
                        Mã danh mục
                        <span><i class="fa-solid fa-arrow-down"></i></span>
                      </th>
                      <th>
                        Tên danh mục<span
                          ><i class="fa-solid fa-arrow-down"></i
                        ></span>
                      </th>
                      <th>Trạng thái</th>
                      <th>Chức năng</th>
                    </tr>
                  </thead>
                  <tbody id="tbody" class="tbody"></tbody>
                </table>
              </div>
              <!-- Pagination -->
              <div id="pagination-component" class="pagination"></div>
            </section>
          </div>
        </header>
      </main>

      <!-- Modal thêm mới, cập nhật sản phẩm -->
      <div id="form-add-category" class="overlay">
        <form onsubmit="handleSubmit(event)" class="form">
          <div class="form-title-group">
            <h3 class="form-title">Thêm mới danh mục</h3>
            <button
              onclick="handleCloseModal()"
              type="button"
              class="btn-close"
            >
              <i class="fa-solid fa-x"></i>
            </button>
          </div>
          <div class="form-body">
            <div class="form-container form-error">
              <label class="form-item">Mã danh mục <span>*</span></label>
              <input id="category-code" class="form-input" type="text" />
              <p id="categoryCodeError" class="text-error"></p>
            </div>
            <div class="form-container form-error">
              <label class="form-item" for=""
                >Tên danh mục <span>*</span></label
              >
              <input id="category-name" class="form-input" type="text" />
              <p id="categoryNameError" class="text-error"></p>
            </div>

            <div class="checkbox-container">
              <label class="form-item" for="">Trạng thái</label>
              <p id="message"></p>
              <div class="checkbox-group">
                <div class="checkbox">
                  <input name="status" type="radio" value="active" checked />
                  <label for="active"> Đang hoạt động </label>
                </div>
                <div class="checkbox">
                  <input value="inactive" name="status" type="radio" />
                  <label for="inActive"> Ngừng hoạt động </label>
                </div>
              </div>
            </div>
            <p id="message"></p>
          </div>

          <div class="form-footer">
            <button
              type="button"
              onclick="handleCloseModal()"
              class="btn-overlay"
            >
              Hủy
            </button>
            <button id="btnAddCategory" class="btn-overlay">Thêm</button>
          </div>
        </form>
      </div>

      <!-- Form cập nhật danh mục -->
      <div id="form-update-category" class="overlay">
        <form onsubmit="handleEditCategory(event)" class="form">
          <div class="form-title-group">
            <h4 class="form-title">Cập nhật danh mục</h4>
            <button id="btnClose" class="btn-close">
              <i class="fa-solid fa-x"></i>
            </button>
          </div>
          <div class="form-container form-error">
            <label class="form-item">Mã danh mục <span>*</span></label>
            <input id="categoryId" class="form-input" type="text" />
            <p id="categoryIdError" class="hidden text-error">
              Mã danh mục không được để trống
            </p>
          </div>
          <div class="form-container form-error">
            <label class="form-item" for="">Tên danh mục <span>*</span></label>
            <input id="categoryName" class="form-input" type="text" />
            <p id="categoryNameError" class="hidden text-error">
              Tên danh mục không được để trống
            </p>
          </div>

          <div class="checkbox-container">
            <label class="form-item" for="">Trạng thái</label>
            <p id="message"></p>
            <div id="checkboxGroup" class="checkbox-group">
              <div class="checkbox">
                <input
                  name="status"
                  id="active"
                  type="radio"
                  value=""
                  checked
                />
                <label for="active"> Đang hoạt động </label>
              </div>
              <div class="checkbox">
                <input name="status" id="inActive" type="radio" value="" />
                <label for="inActive"> Ngừng hoạt động </label>
              </div>
            </div>
          </div>
          <p id="message"></p>

          <div class="button-group">
            <button id="btnCancel" class="btn-overlay">Hủy</button>
            <button id="btnAddCategory" class="btn-overlay">Lưu</button>
          </div>
        </form>
      </div>

      <!-- Xác nhận xóa modal -->
      <div id="form-delete-category" class="overlay" style="display: flex">
        <form onsubmit="handleDeleteCategory(id)" class="form-delete">
          <div class="warning">
            <span class="icon-warning"
              ><i class="fa-solid fa-triangle-exclamation"></i
            ></span>
            <div class="text-waring">
              <p class="warning-title">Xác nhận</p>
              <span
                >Bạn có chắc chắn muốn xóa danh mục <b>DM001</b> khỏi hệ thống
                không?</span
              >
            </div>
          </div>
          <div class="btn-warning">
            <button onclick="handleCloseModal()" class="btn btnCancel">
              Hủy
            </button>
            <button class="btn btnDelete">Xóa</button>
          </div>
        </form>
      </div>
    </div>
    <!-- Script -->
    <script src="../js/aside.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/manager_category.js"></script>

    <!-- Gán phần chuỗi HTML vào component -->
    <script>
      document.querySelector("#menu-component").innerHTML =
        renderAside("manager-category");

      document.querySelector("#header-component").innerHTML =
        renderHeader("manager-category");

      document.querySelector("#pagination-component").innerHTML =
        renderPagination("manager-category");
    </script>
  </body>
</html>
