<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/register.css" />
  </head>
  <body>
    <div class="register-container">
      <form id="formRegister" class="form" action="">
        <header class="form-header">
          <h3 class="title">Đăng ký tài khoản</h3>
          <p class="description">Đăng ký tài khoản để sử dụng dịch vụ</p>
        </header>
        <main class="form-body">
          <div class="form-group-name">
            <div class="form-group">
              <label class="form-label" for="userFamilyName"
                >Họ và tên đệm</label
              >
              <input id="userFamilyName" class="form-input" type="text" />
              <p class="hidden text-error" id="userFamilyNameError">
                Họ không được để trống
              </p>
            </div>
            <div class="form-group">
              <label class="form-label" for="userName">Tên</label>
              <input id="userName" class="form-input" type="text" />
              <p class="hidden text-error" id="userNameError">
                Tên không được để trống
              </p>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input
              id="email"
              class="form-input"
              type="text"
              placeholder="you@company.com"
            />
            <p class="hidden text-error" id="emailError">
              Email không được để trống
            </p>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Mật khẩu</label>
            <input id="password" class="form-input" type="password" />
            <p class="hidden text-error" id="passwordError">
              Mật khẩu không được để trống
            </p>
          </div>
          <div class="form-group">
            <label class="form-label" for="rePassword">Xác nhận mật khẩu</label>
            <input id="rePassword" class="form-input" type="password" />
            <p class="hidden text-error" id="rePasswordError">
              Mật khẩu không được để trống
            </p>
          </div>
          <div class="form-function">
            <div class="agree">
              <input id="agree" class="input-checkbox" type="checkbox" />
              <span
                >Bạn đồng ý với <a href="">chính sách và điều khoản</a></span
              >
            </div>
            <p id="message"></p>
          </div>
        </main>
        <footer class="form-footer">
          <button type="submit" class="form-button">Đăng ký</button>
          <p class="form-redirect">
            <span
              >Bạn đã có tài khoản? <a href="./login.html">Đăng nhập</a></span
            >
          </p>
        </footer>
      </form>
    </div>
    <!-- Script -->
    <script src="../js/register.js"></script>
  </body>
</html>
