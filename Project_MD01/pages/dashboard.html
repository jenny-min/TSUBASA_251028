<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang thống kê</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="main-container">
      <!-- Phần sidebar -->
      <aside id="menu-component" class="aside"></aside>
      <!-- Phần section product -->
      <section class="-section-category">
        <!-- Section header -->
        <header class="section-header">
          <div id="renderHeader" class="header-nav">
            <i class="fa-solid fa-bell"></i>
            <img
              class="user-img"
              src="../utils/images/product_manager_images/user_img.png"
              alt=""
            />
          </div>
          <div class="section-container">
            <div class="header-title">
              <h1 class="title">Thống kê</h1>
              <!-- Modal Logout -->
              <!-- Nút Logout -->
              <button
                onclick="handleShowModal()"
                class="btn btn-danger btn-log-out"
                id="btnLogout"
                data-bs-toggle="modal"
                data-bs-target="#logoutModal"
              >
                Logout
              </button>

              <!-- Modal Logout -->
              <div
                class="modal fade"
                id="logoutModal"
                tabindex="-1"
                aria-labelledby="logoutModalLabel"
                aria-hidden="true"
              >
                <div class="modal-dialog modal-dialog-centered">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h5 class="modal-title" id="logoutModalLabel">
                        Confirm Logout
                      </h5>
                      <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                      ></button>
                    </div>
                    <div class="modal-body">
                      Are you sure you want to log out?
                    </div>
                    <div class="modal-footer">
                      <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                      >
                        Cancel
                      </button>
                      <button
                        type="button"
                        class="btn btn-danger"
                        id="confirmLogoutBtn"
                      >
                        Logout
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </header>
      </section>
    </div>
    <!-- Script -->
    <script src="../js/auth.js"></script>
    <script src="../js/aside.js"></script>
    <script src="../js/header.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/logout.js"></script>

    <!-- Gán phần chuỗi HTML vào component -->
    <script>
      document.querySelector("#menu-component").innerHTML =
        renderAside("dashboard");
      document.querySelector("#header-component").innerHTML =
        renderHeader("dashboard");
    </script>
  </body>
</html>
