<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang thống kê</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="main-container">
      <!-- Phần sidebar -->
      <aside id="menu-component" class="aside"></aside>
      <!-- Phần section product -->
      <section class="-section-category">
        <!-- Section header -->
        <header class="section-header">
          <div id="renderHeader" class="header-nav">
            <i class="fa-solid fa-bell"></i>
            <img
              class="user-img"
              src="../utils/images/product_manager_images/user_img.png"
              alt=""
            />
          </div>
          <div class="section-container">
            <div class="header-title">
              <h1 class="title">Thống kê</h1>
              <button
                onclick="handleLogout()"
                id="btnLogout"
                class="btn-log-out"
              >
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                Log out
              </button>
            </div>
          </div>
        </header>
      </section>
    </div>
    <!-- Script -->
    <script src="../js/aside.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/logout.js"></script>

    <!-- Gán phần chuỗi HTML vào component -->
    <script>
      document.querySelector("#menu-component").innerHTML =
        renderAside("dashboard");
      document.querySelector("#header-component").innerHTML =
        renderHeader("dashboard");
    </script>
  </body>
</html>
