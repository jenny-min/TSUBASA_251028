<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="login-container">
      <form id="formLogin" class="form" action="">
        <header class="form-header">
          <h3 class="title">Đăng nhập</h3>
          <p class="description hidden-mobile">
            Đăng nhập tài khoản để sử dụng hệ thống quản lý.
          </p>
          <p class="description show-mobile hidden">
            Đăng nhập tài khoản để sử dụng dịch vụ
          </p>
        </header>
        <main class="form-body">
          <div class="form-group">
            <label class="form-label" for="email">Email:</label>
            <input id="email" class="form-input" type="text" />
            <p class="hidden text-error" id="emailError">
              Email không được để trống
            </p>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Mật khẩu:</label>
            <input id="password" class="form-input" type="password" />
            <p class="hidden text-error" id="passwordError">
              Mật khẩu không được để trống
            </p>
          </div>
          <div class="form-function hidden-mobile">
            <div class="remember-account">
              <input class="input-checkbox" type="checkbox" />
              <span>Nhớ tài khoản</span>
            </div>
            <div class="forgot-account">
              <a href="">Quên mật khẩu</a>
            </div>
          </div>
          <div class="form-function show-mobile hidden">
            <div class="remember-account forgot-account">
              <input class="input-checkbox" type="checkbox" />
              <span
                >Bạn đồng ý với <a href="">chính sách và điều khoản</a></span
              >
            </div>
          </div>
        </main>
        <div class="hidden text-error" id="loginError">
          Email và mật khẩu không đúng
        </div>
        <footer class="form-footer forgot-account">
          <button type="submit" class="form-button">Đăng nhập</button>
          <p class="form-redirect hidden-mobile">
            <span
              >Bạn chưa có tài khoản?
              <a href="./register.html">Đăng ký</a></span
            >
          </p>
        </footer>
      </form>
    </div>
    <script src="../js/login.js"></script>
  </body>
</html>
